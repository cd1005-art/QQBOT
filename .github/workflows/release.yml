name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包源码
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/qqbot-${VERSION}.tar.gz" \
            --exclude='.git' --exclude='.github' --exclude='.workbuddy' \
            --exclude='promo' --exclude='data' --exclude='config.toml' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.venv*' \
            --exclude='out' --exclude='build_promo.py' --exclude='PLAN.md' \
            --exclude='QQ机器人项目计划.txt' --exclude='.dockerignore' \
            .
          cp "dist/qqbot-${VERSION}.tar.gz" "dist/qqbot.tar.gz"
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          ls -lh dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(cat <<EOF
          QQBOT ${GITHUB_REF_NAME}

          ### 安装
          \`\`\`bash
          tar -xzf qqbot-${VERSION}.tar.gz -C qqbot && cd qqbot
          bash install.sh              # 装到 /opt/qqbot 并注册 systemd
          bash install.sh --check      # 只检查环境
          \`\`\`

          升级时重跑 install.sh 即可，config.toml 与 data/ 不会被覆盖。

          ### 校验
          \`\`\`bash
          sha256sum -c qqbot-${VERSION}.tar.gz.sha256
          \`\`\`
          EOF
          )
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "QQBOT ${GITHUB_REF_NAME}" \
            --notes "$NOTES"
