name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包源码
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/qqbot-${VERSION}.tar.gz" \
            --exclude='dist' --exclude='.release-test' \
            --exclude='.git' --exclude='.github' --exclude='.workbuddy' \
            --exclude='promo' --exclude='data' --exclude='config.toml' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.venv*' \
            --exclude='out' --exclude='build_promo.py' --exclude='PLAN.md' \
            --exclude='QQ机器人项目计划.txt' --exclude='.dockerignore' \
            .
          cp "dist/qqbot-${VERSION}.tar.gz" "dist/qqbot.tar.gz"
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          ls -lh dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "QQBOT ${GITHUB_REF_NAME}"
            echo
            echo "### 安装"
            echo '```bash'
            echo "tar -xzf qqbot-${VERSION}.tar.gz -C qqbot && cd qqbot"
            echo "sudo bash install.sh"
            echo '```'
            echo
            echo "只检查环境：\`bash install.sh --check\`；升级重跑同一命令，config.toml 与 data/ 不会被覆盖。"
            echo
            echo "### 校验"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "镜像：\`docker pull ghcr.io/cd1005-art/qqbot:${GITHUB_REF_NAME}\`"
          } > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "QQBOT ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
