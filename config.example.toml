# 复制为 config.toml 后填写。config.toml 已在 .gitignore 中，不会被提交。

[bot]
app_id = ""
# 建议留空，改用环境变量 QQBOT_APP_SECRET，避免凭证明文落盘
app_secret = ""
sandbox = false

[safety]
# 硬锁：true 时任何写操作只预览不执行。联调通过后再改 false
dry_run = true
# 群白名单（group_openid）。留空 = 不限制；生产环境建议填写
allowed_groups = []
timeout = 15

[webhook]
# 只监听回环，由同机 nginx 以 443 反代
host = "127.0.0.1"
port = 18900
path = "/qqbot/webhook"
max_body = 1048576
log_events = true

[panel]
enabled = true
host = "127.0.0.1"
port = 18901
# 面板登录密码，留空则拒绝登录
password = ""

[llm]
# 大模型对话：任意 OpenAI 兼容接口（OpenAI / DeepSeek / Moonshot / 通义 / Ollama / one-api）
enabled = false
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
# 触发方式：at = 仅 @机器人；all = 所有消息（配合冷却，慎用）
trigger = "at"
# 额外触发词，命中即回，不需要 @
keywords = []
system = "你是 QQ 群里的助手，回答简洁，控制在 80 字以内，不要使用 markdown。"
max_tokens = 300
temperature = 0.7
# 每群携带的上下文轮数
context_turns = 6
# 每群冷却秒数
cooldown = 3
# 每群每天最多回复次数
daily_limit = 200

[reply]
# 回复时是否 @ 提问者。群聊 @ 用户只支持 markdown 消息，失败会自动退回纯文本
at_user = false

[vision]
# 群图片自动审核：下载图片 → 视觉模型判断 → 违规则撤回/禁言
enabled = false
# 以下三项留空表示沿用 [llm] 的配置
model = ""
base_url = ""
api_key = ""
# 图片识别：让模型看懂图，用于群聊问答（与审核独立开关）
chat_enabled = false
# 违规动作：recall | mute | recall_mute | none
action = "recall_mute"
minutes = 10
# 违规后补一句提示，留空则只处置不发言
notice = ""
# 单张图片大小上限（字节）
max_bytes = 8388608
max_tokens = 800
# 判定提示词，留空用内置默认（要求模型只输出 JSON）
prompt = ""

[image]
# 网络找图：群友说「来张二次元图片」时，从图源找一张发到群里
search_enabled = false
# 单张上限，二进制直传平台限制 5MB
max_bytes = 5242880
# 允许的类别白名单：必须勾选才生效，空数组 = 全部禁止
# 可选：二次元 动漫 搞笑 沙雕 恐怖 风景 宠物 猫 狗 游戏 汽车 美食 美女
categories = ["二次元", "动漫", "漫画", "插画", "壁纸", "搞笑", "风景", "宠物", "游戏", "表情包"]

[about]
# 开源项目信息。Star 门槛默认关闭：即使开启，fork 后删掉即可绕过，
# 且 GitHub 的 stargazers 接口现已要求鉴权，不配 token 会 fail-open。
repo = "cd1005-art/QQBOT"
require_star = false
# 软提示：登录后弹一次「点个 Star」，和硬门槛互斥
soft_prompt = true
# 间隔小时；0 表示只弹一次，点过不再弹
soft_interval_hours = 24
# 要校验的 GitHub 用户名（部署者自己的账号；注意不能给自己仓库点 Star）
star_user = ""
# 可选：GitHub Token（只需 public_repo 读权限），不配则无法校验
github_token = ""

[message]
# 官方标签，纯文本 "@全体成员" 只会显示灰字、不触发提醒
at_all_template = "<qqbot-at-everyone />"

[paths]
db = "data/qqbot.db"
