# 复制为 config.toml 后填写。config.toml 已在 .gitignore 中，不会被提交。

[bot]
app_id = ""
# 建议留空，改用环境变量 QQBOT_APP_SECRET，避免凭证明文落盘
app_secret = ""
sandbox = false

[safety]
# 硬锁：true 时任何写操作只预览不执行。联调通过后再改 false
dry_run = true
# 群白名单（group_openid）。留空 = 不限制；生产环境建议填写
allowed_groups = []
timeout = 15

[webhook]
# 只监听回环，由同机 nginx 以 443 反代
host = "127.0.0.1"
port = 18900
path = "/qqbot/webhook"
max_body = 1048576
log_events = true

[panel]
enabled = true
host = "127.0.0.1"
port = 18901
# 面板登录密码，留空则拒绝登录
password = ""

[llm]
# 大模型对话：任意 OpenAI 兼容接口（OpenAI / DeepSeek / Moonshot / 通义 / Ollama / one-api）
enabled = false
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
# 触发方式：at = 仅 @机器人；all = 所有消息（配合冷却，慎用）
trigger = "at"
# 额外触发词，命中即回，不需要 @
keywords = []
system = "你是 QQ 群里的助手，回答简洁，控制在 80 字以内，不要使用 markdown。"
max_tokens = 300
temperature = 0.7
# 每群携带的上下文轮数
context_turns = 6
# 每群冷却秒数
cooldown = 3
# 每群每天最多回复次数
daily_limit = 200

[reply]
# 回复时是否 @ 提问者。群聊 @ 用户只支持 markdown 消息，失败会自动退回纯文本
at_user = false

[message]
# 官方标签，纯文本 "@全体成员" 只会显示灰字、不触发提醒
at_all_template = "<qqbot-at-everyone />"

[paths]
db = "data/qqbot.db"
