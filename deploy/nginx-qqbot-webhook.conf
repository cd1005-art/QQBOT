# 放在 /www/server/panel/vhost/nginx/extension/qqbot.oddpp.com/qqbot-webhook.conf
# 宝塔站点主配置已 include 这个目录，改动不影响主配置，也不会被面板覆盖。
# ^~ 保证优先于站点里的静态资源 / 敏感文件正则 location。

location ^~ /qqbot/webhook {
    proxy_pass http://127.0.0.1:18900;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 平台要求 3 秒内响应，超时给短一点，让它尽早重推
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    client_max_body_size 1m;
    access_log /www/wwwlogs/qqbot.oddpp.com.webhook.log;
}

# 管理面板 API → Python
location ^~ /panel/api/ {
    proxy_pass http://127.0.0.1:18901;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
    access_log /www/wwwlogs/qqbot.oddpp.com.panel.log;
}

# 管理面板静态资源 → 直接由 nginx 读站点目录
location ^~ /panel/ {
    root /www/wwwroot/qqbot.oddpp.com;
    try_files $uri $uri/ /panel/index.html;
    # 面板是自更新频繁的管理界面，禁掉强缓存，避免用户看到旧 JS
    add_header Cache-Control "no-cache, must-revalidate" always;
    access_log /www/wwwlogs/qqbot.oddpp.com.panel.log;
}

location = /panel {
    return 301 /panel/;
}
