<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>QQBOT 控制台</title>
<link rel="stylesheet" href="app.css?v=20261111n">
</head>
<body>

<div id="login" class="hide">
  <div class="login-box">
    <h2>QQBOT 控制台</h2>
    <p class="sub" id="loginHint">输入面板密码</p>
    <input id="pwd" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn pri mt12" style="width:100%" onclick="doLogin()">登录</button>
  </div>
</div>

<div class="layout hide" id="app">
  <aside class="side">
    <div class="brand"><span class="logo"></span><span>QQBOT<small>群管理控制台</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span class="dot" id="dotState"></span><span id="botName">连接中…</span></div>
      <div id="lockState"></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="stargate" class="hide" style="position:fixed;inset:0;z-index:210;background:rgba(10,13,18,.96);display:flex;align-items:center;justify-content:center;padding:20px">
  <div class="login-box">
    <h2>先给项目点个 Star</h2>
    <p class="sub" id="starRepo">本项目完全免费，使用前请为仓库点一个 Star</p>
    <a class="btn pri" id="starLink" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener">去 GitHub 点 Star</a>
    <button class="btn mt12" style="width:100%" onclick="recheckStar()">我已 Star，重新检测</button>
    <div class="sub mt12" id="starMsg" style="color:var(--muted);font-size:12px;margin:10px 0 0"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=20261111n"></script>
<script>
/* 未完成初始化：直接进引导页 */
(async function () {
  try {
    const r = await fetch("/panel/api/setup/status");
    const j = await r.json();
    if (j.ok && j.data.needed) location.replace("setup.html");
  } catch (e) { /* 忽略，交给 app.js 处理 */ }
})();
</script>
</body>
</html>
